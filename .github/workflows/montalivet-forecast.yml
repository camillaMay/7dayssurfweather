name: Fetch Surf Forecast

on:
  schedule:
    - cron: '25 0,6,12,18 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make data folder
        run: mkdir -p data

      - name: Fetch raw HTML (hourly page)
        run: |
          curl -sL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://www.surf-forecast.com/breaks/Montalivetles-Bains/forecasts/latest" \
            -o data/montalivet-hourly.html

      - name: Fetch raw HTML (16-day page)
        run: |
          curl -sL \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://www.surf-forecast.com/breaks/Montalivetles-Bains/forecasts/latest/six_day" \
            -o data/montalivet-16day.html

      - name: Parse to clean JSON
        run: python3 scripts/parse_surf.py data/montalivet-hourly.html data/montalivet-16day.html data/swell.json
      
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet --cached || git commit -m "Update surf forecast $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
